<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>karnataka Administrative rules</title>
  
  <!-- Link to your external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Administrative Rules </h2>
    
    <div class="search-container">
      <!-- Live Count Tracker Badge -->
      <div id="countTracker" class="counter-badge" style="display: none;">Showing 0 rules</div>
      
      <!-- Real-time Filter Search Input Layout -->
      <input type="text" id="searchInput" class="search-box" placeholder="Search rules by name..." onkeyup="filterTable()">
    </div>
    
    <div class="table-container">
      <div id="loader" class="loading">Loading directory data...</div>
      <table id="rulesTable" style="display:none;">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Link to your external JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
